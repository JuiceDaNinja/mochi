[workspace]
resolver = "2"
members = [
    "crates/mochi-core",
    "crates/mochi-brain-mock",
    "crates/mochi-brain-claude",
    "crates/mochi-brain-local",
    "crates/mochi-platform-windows",
    "crates/mochi-link",
    "apps/desktop/src-tauri",
]
# The Tauri app needs platform GUI libraries; `cargo test` at the root runs the
# portable crates only. Build the app from apps/desktop with `pnpm tauri dev`.
default-members = ["crates/mochi-core", "crates/mochi-brain-mock", "crates/mochi-brain-claude", "crates/mochi-brain-local", "crates/mochi-platform-windows", "crates/mochi-link"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1"
tracing = "0.1"
