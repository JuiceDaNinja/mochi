[package]
name = "mochi-link"
description = "Desktop side of the phone link: TLS WebSocket server with a pinned self-signed certificate, mDNS advertisement, two-sided pairing, HMAC auth, keepalive."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mochi-core = { path = "../mochi-core" }
mochi-secrets = { path = "../mochi-secrets" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-tungstenite = "0.30"
futures-util = "0.3"
mdns-sd = "0.21"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hostname = "0.4"
# TLS with the `ring` backend: no cmake/nasm needed on the Windows CI runner.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
