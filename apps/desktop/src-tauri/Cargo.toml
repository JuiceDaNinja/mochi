[package]
name = "mochi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mochi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mochi-core = { path = "../../../crates/mochi-core" }
mochi-brain-mock = { path = "../../../crates/mochi-brain-mock" }
mochi-brain-claude = { path = "../../../crates/mochi-brain-claude" }
mochi-brain-local = { path = "../../../crates/mochi-brain-local" }
mochi-brain-codex = { path = "../../../crates/mochi-brain-codex" }
mochi-platform-windows = { path = "../../../crates/mochi-platform-windows" }
mochi-secrets = { path = "../../../crates/mochi-secrets" }
mochi-link = { path = "../../../crates/mochi-link" }
hostname = "0.4"
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
