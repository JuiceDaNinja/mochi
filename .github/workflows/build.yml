name: Build Mochi

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Rust + TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mochi/desktop test
      # The live Claude Code test skips itself when the CLI is not installed.
      - run: cargo test

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri app
        run: pnpm --filter @mochi/desktop tauri build
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi out/ -ErrorAction SilentlyContinue
          Copy-Item apps/desktop/src-tauri/target/release/mochi-desktop.exe out/Mochi-portable.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-windows
          path: out/*

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK
        working-directory: apps/android
        run: |
          gradle wrapper --gradle-version 8.11.1 --no-daemon
          ./gradlew --no-daemon test assembleDebug
          mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/Mochi-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-android
          path: apps/android/out/Mochi-android.apk

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Mochi-windows/*
            dist/Mochi-android/*
