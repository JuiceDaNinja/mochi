name: Build Mochi

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Create a release with this tag (e.g. v0.1.0); leave empty to just build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Rust + TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mochi/desktop test
      # The live Claude Code test skips itself when the CLI is not installed.
      - run: cargo test

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri app
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @mochi/desktop tauri build 2>&1 | tee build.log
      - name: Publish errors for review
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: windows-${{ github.run_number }}
        run: |
          { grep -nE -A8 "error(\[E[0-9]+\])?:|^e: |error TS|What went wrong|FAILURE|Caused by|panicked" build.log | head -600; echo; echo "----- tail -----"; tail -120 build.log; } > errors.txt || true
          R="$GITHUB_REPOSITORY"
          if ! gh api "repos/$R/git/refs/heads/ci-logs" >/dev/null 2>&1; then
            MAIN=$(gh api "repos/$R/git/refs/heads/main" --jq .object.sha)
            gh api -X POST "repos/$R/git/refs" -f ref=refs/heads/ci-logs -f sha="$MAIN" >/dev/null
          fi
          gh api -X PUT "repos/$R/contents/logs/$NAME.txt" -f message="ci log $NAME" -f branch=ci-logs -f content="$(base64 -w0 errors.txt)" >/dev/null
          echo "published logs/$NAME.txt on branch ci-logs"
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # Cargo workspace: bundles land in the root target/ directory.
          Get-ChildItem -Recurse -Path target,apps/desktop/src-tauri/target -Include *.exe,*.msi -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'release' -and $_.FullName -notmatch 'build\\|deps\\' } |
            ForEach-Object { Copy-Item $_.FullName out/ }
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if (Test-Path out/mochi-desktop.exe) { Rename-Item out/mochi-desktop.exe "Mochi_${v}_x64-portable.exe" }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-windows
          path: out/*

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          # One version for everything: the Tauri config is the source of truth.
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          CODE=$(( $(echo "$VERSION" | cut -d. -f1) * 10000 + $(echo "$VERSION" | cut -d. -f2) * 100 + $(echo "$VERSION" | cut -d. -f3) ))
          cd apps/android
          { gradle wrapper --gradle-version 8.11.1 --no-daemon && ./gradlew --no-daemon --stacktrace -PmochiVersion="$VERSION" -PmochiVersionCode="$CODE" test assembleDebug; } 2>&1 | tee ../../build.log
          mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk "out/Mochi_${VERSION}_android.apk"
      - name: Publish errors for review
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: android-${{ github.run_number }}
        run: |
          { grep -nE -A8 "error(\[E[0-9]+\])?:|^e: |error TS|What went wrong|FAILURE|Caused by|panicked" build.log | head -600; echo; echo "----- tail -----"; tail -120 build.log; } > errors.txt || true
          R="$GITHUB_REPOSITORY"
          if ! gh api "repos/$R/git/refs/heads/ci-logs" >/dev/null 2>&1; then
            MAIN=$(gh api "repos/$R/git/refs/heads/main" --jq .object.sha)
            gh api -X POST "repos/$R/git/refs" -f ref=refs/heads/ci-logs -f sha="$MAIN" >/dev/null
          fi
          gh api -X PUT "repos/$R/contents/logs/$NAME.txt" -f message="ci log $NAME" -f branch=ci-logs -f content="$(base64 -w0 errors.txt)" >/dev/null
          echo "published logs/$NAME.txt on branch ci-logs"
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-android
          path: apps/android/out/*.apk

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Mochi ${{ inputs.tag || github.ref_name }}
          body: "Windows: run the `Mochi_<version>_x64-setup.exe` installer (or the portable exe). Android: install `Mochi_<version>_android.apk` (allow installs from unknown sources)."
          files: |
            dist/Mochi-windows/*
            dist/Mochi-android/*
